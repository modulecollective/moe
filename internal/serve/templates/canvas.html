<!doctype html>
<html lang="en">
<head>
{{template "head" .}}
<title>{{.Project}}/{{.Slug}} {{.Stage}} — MoE</title>
</head>
<body>
<main>
  <header class="page-header">
    <div class="banner">
      <a href="/" class="banner-bar">▓▒░ MINISTRY OF EVERYTHING ░▒▓</a>
      <div class="banner-sub"><a href="/">dashboard</a> → <a href="/projects">projects</a> → <a href="/projects/{{.Project}}">{{.Project}}</a> → <a href="/run/{{.Project}}/{{.Slug}}">{{.Slug}}</a> → {{.Stage}}</div>
    </div>
    {{template "headeractions" .}}
  </header>

  {{if .Missing}}
  <p class="meta">no canvas yet at <code>{{.Path}}</code></p>
  {{else}}
  <p class="meta">{{.ModTime}}</p>
  <article class="doc">{{.Body}}</article>
  {{end}}
</main>
{{template "themejs" .}}
</body>
</html>
